name: API health check

# Polls the production health endpoint from GitHub's infrastructure — deliberately
# NOT from the VPS, because the failure this exists to catch is the API becoming
# unreachable. A checker running on the same box cannot report that.
#
# Background: in August the Stripe webhook endpoint failed for nine consecutive
# days and was disabled, and nobody noticed until customers reported paying and
# staying on the free plan. Stripe sent five warning emails first. The whole
# outage was silent because nothing was watching.
#
# /api/health returns 503 when the database is disconnected OR the event loop is
# blocked for more than 5 seconds — the condition that starves incoming webhook
# requests while the site still looks up.
#
# NOTE: GitHub's scheduler is best-effort. A */10 cron typically runs every
# 10-25 minutes and can be delayed further when GitHub is busy, so treat this as
# a safety net, not a pager. An external uptime service polling every minute is
# still worth having alongside it.
# NOTE: scheduled workflows are disabled automatically after 60 days without
# repository activity. GitHub emails you before that happens.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:        # lets you run it on demand from the Actions tab

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe /api/health
        run: |
          set -uo pipefail
          URL="https://api.tododjs.com/api/health"

          # Two attempts 20s apart, so a single blip does not page anyone.
          for attempt in 1 2; do
            echo "── attempt $attempt ──"
            BODY=$(curl -sS --max-time 25 -w $'\n%{http_code}' "$URL" 2>&1) || BODY=$'\n000'
            CODE=$(printf '%s' "$BODY" | tail -1)
            JSON=$(printf '%s' "$BODY" | sed '$d')

            echo "HTTP $CODE"
            echo "$JSON"

            if [ "$CODE" = "200" ]; then
              echo "✅ healthy"
              exit 0
            fi

            if [ "$attempt" = "1" ]; then
              echo "not healthy — retrying in 20s"
              sleep 20
            fi
          done

          echo ""
          echo "══════════════════════════════════════════════════════════"
          echo "❌ API UNHEALTHY — HTTP $CODE"
          echo ""
          if [ "$CODE" = "000" ]; then
            echo "No response at all: DNS, TLS, Nginx or the Node process."
            echo "This is the shape of failure Stripe reported in August"
            echo "(\"requests had other errors\" = could not complete the request)."
          elif [ "$CODE" = "503" ]; then
            echo "The API answered but reports itself degraded."
            echo "Check the JSON above:"
            echo "  database: disconnected  -> MongoDB/Atlas connectivity"
            echo "  eventLoop: blocked      -> CPU work starving the process"
            echo "                             (ZIP building, audio analysis)"
            echo "     Webhooks and API requests are being dropped right now."
          fi
          echo ""
          echo "On the VPS:  pm2 status && pm2 logs tododjs-api --lines 50 --nostream"
          echo "Also check Stripe -> Developers -> Webhooks for delivery failures."
          echo "══════════════════════════════════════════════════════════"
          exit 1
